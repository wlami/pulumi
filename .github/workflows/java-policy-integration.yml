name: java-policy-integration

on:
  push:
    branches: [master, feature/java-policy-integration-mvp, feature/java-policy-integration-c2-ci-green]
    paths:
      - 'tests/integration/policy/java_policy_pack/**'
      - 'tests/integration/java_policy_program/**'
      - 'tests/integration/integration_policy_java_test.go'
      - '.github/workflows/java-policy-integration.yml'
  pull_request:
    paths:
      - 'tests/integration/policy/java_policy_pack/**'
      - 'tests/integration/java_policy_program/**'
      - 'tests/integration/integration_policy_java_test.go'
      - '.github/workflows/java-policy-integration.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pulumi (this repo)
        uses: actions/checkout@v4
        with:
          path: pulumi

      - name: Checkout wlami/pulumi-policy (Plan A + D Phase 1 SDK)
        uses: actions/checkout@v4
        with:
          repository: wlami/pulumi-policy
          ref: feature/java-policy-sdk-value-wrappers
          path: pulumi-policy

      - name: Checkout wlami/pulumi-java (Plan B language plugin)
        uses: actions/checkout@v4
        with:
          repository: wlami/pulumi-java
          ref: feature/language-plugin-policy-mode-mvp
          path: pulumi-java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Plan D SDK to local Maven repo
        working-directory: pulumi-policy/sdk/java
        run: mvn -q -B -ntp -DskipTests install

      - name: Build pulumi-language-java into pulumi/bin
        working-directory: pulumi-java
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pulumi/bin"
          go build -o "$GITHUB_WORKSPACE/pulumi/bin/pulumi-language-java" ./pkg/cmd/pulumi-language-java

      - name: Build pulumi CLI into pulumi/bin
        working-directory: pulumi/pkg
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pulumi/bin"
          go build -o "$GITHUB_WORKSPACE/pulumi/bin/pulumi" ./cmd/pulumi

      - name: Run TestJavaPolicyPack
        working-directory: pulumi/tests
        run: go test -tags java_policy_integration ./integration -run TestJavaPolicyPack -v -timeout 15m
